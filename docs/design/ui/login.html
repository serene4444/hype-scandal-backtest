iv><div data-dc-tpl="27" style="display: flex; border: 1px solid rgb(58, 65, 75); border-radius: 2px; background: rgb(10, 12, 15);"><input data-dc-tpl="28" id="password" type="password" value="hypevsscandal" style="flex: 1 1 auto; min-width: 0px; min-height: 42px; box-sizing: border-box; font-family: inherit; font-size: 15px; padding: 0px 12px; color: rgb(230, 232, 235); background: transparent; border: 0px;"><button data-dc-tpl="29" type="button" aria-label="Show password" style="min-width: 64px; min-height: 42px; font-family: &quot;IBM Plex Mono&quot;, monospace; font-size: 12px; color: rgb(180, 185, 192); background: transparent; border-width: 0px 0px 0px 1px; border-style: none none none solid; border-color: currentcolor currentcolor currentcolor rgb(58, 65, 75); border-image: none;">SHOW</button></div></div><div data-dc-tpl="30" style="display: flex; align-items: center; gap: 10px; font-size: 14px;"><input data-dc-tpl="31" id="remember" type="checkbox" checked="" style="width: 18px; height: 18px; accent-color: rgb(230, 232, 235);"><label data-dc-tpl="32" for="remember">Keep me logged in</label></div><a data-dc-tpl="33" href="dashboard.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: rgb(10, 12, 15); background: rgb(230, 232, 235); text-decoration: none; border-radius: 2px;">Log in</a><div data-dc-tpl="34" style="display: flex; align-items: center; gap: 12px; color: rgb(155, 161, 169); font-size: 12px;"><div data-dc-tpl="35" style="flex: 1 1 0px; height: 1px; background: rgb(42, 48, 56);"></div><span data-dc-tpl="36" style="font-family: &quot;IBM Plex Mono&quot;, monospace;">OR</span><div data-dc-tpl="37" style="flex: 1 1 0px; height: 1px; background: rgb(42, 48, 56);"></div></div><a data-dc-tpl="38" href="run-a-backtest.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; font-size: 13px;
