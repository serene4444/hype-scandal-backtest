name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check the backend address is set
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Repository variable VITE_API_URL is not set (Settings > Secrets and variables > Actions > Variables). Without it the published site cannot reach the backend."
            exit 1
          fi
          case "$VITE_API_URL" in
            https://*) echo "Backend: $VITE_API_URL" ;;
            *) echo "::error::VITE_API_URL must start with https:// (got: $VITE_API_URL)"; exit 1 ;;
          esac
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          GITHUB_PAGES: "true" # makes vite.config.ts use base '/hype-scandal-backtest/'
          VITE_API_URL: ${{ vars.VITE_API_URL }} # Settings > Secrets and variables > Actions > Variables
      # Pages has no rewrites: unknown paths like /results/123 get 404.html, so make that the app itself.
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
      - id: deployment
        uses: actions/deploy-pages@v4
